<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dori Kategoriyalari</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<body>
<!-- Sahifa sarlavhasi -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h1 class="mb-0">
                    <i class="fas fa-pills me-3"></i>
                    Dori Kategoriyalari
                </h1>
                <p class="mb-0 mt-2 opacity-75">Dorixona tizimi uchun kategoriyalarni boshqaring</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-light btn-lg" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="fas fa-plus me-2"></i>
                    Yangi Kategoriya
                </button>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <!-- Kategoriyalar ro'yxati -->
    <div class="row">
        <div class="row" th:each="category : ${categories}">
            <div class="col-md-6 col-lg-4 mb-4">
                <div class="card category-card h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title text-primary" th:text="${category.name}">
                                Og'riq qoldiruvchi dorilar
                            </h5>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-secondary" type="button"
                                        data-bs-toggle="dropdown">
                                    <i class="fas fa-ellipsis-v"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li>
                                        <a class="dropdown-item" href="#"
                                           th:onclick="'editCategory(' + ${category.id} + ', \'' + ${category.name} + '\', \'' + ${category.description} + '\')'">
                                            <i class="fas fa-edit me-2"></i>Tahrirlash
                                        </a>
                                    </li>
                                    <li>
                                        <hr class="dropdown-divider">
                                    </li>
                                    <li>
                                        <a class="dropdown-item text-danger" href="#"
                                           th:onclick="'deleteCategory(' + ${category.id} + ', \'' + ${category.name} + '\')'">
                                            <i class="fas fa-trash me-2"></i>O'chirish
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <p class="card-text text-muted" th:text="${category.description}">
                            Og'riq va yallig'lanishga qarshi dorilar kategoriyasi
                        </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                ID: <span th:text="${category.id}">1</span>
                            </small>
                            <div>
                                <button class="btn btn-sm btn-outline-primary btn-action"
                                        th:onclick="'editCategory(' + ${category.id} + ', \'' + ${category.name} + '\', \'' + ${category.description} + '\')'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger btn-action"
                                        th:onclick="'deleteCategory(' + ${category.id} + ', \'' + ${category.name} + '\')'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Agar kategoriyalar bo'sh bo'lsa -->
        <div class="col-12" th:if="${categories == null or categories.empty}">
            <div class="text-center py-5">
                <i class="fas fa-box-open fa-5x text-muted mb-4"></i>
                <h3 class="text-muted">Kategoriyalar topilmadi</h3>
                <p class="text-muted">Hozircha hech qanday kategoriya mavjud emas. Yangi kategoriya qo'shing.</p>
                <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="fas fa-plus me-2"></i>
                    Birinchi kategoriyani qo'shish
                </button>
            </div>
        </div>
    </div>
</div>
