<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">-->

<head>
    <meta charset="UTF-8">
    <title>Home page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo01"
                aria-controls="navbarTogglerDemo01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
            <a class="navbar-brand" href="#">Hidden brand</a>
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#" sec:authorize="isAuthenticated()"
                       th:text="${#authentication.name}"></a>
                    <a class="nav-link active" aria-current="page" href="#" sec:authorize="isAnonymous()">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
            </ul>
            <button class="btn btn-info" sec:authorize="hasRole('ADMIN')" type="submit"><a href="/login">all statics</a>
            </button>
            <button class="btn btn-info" sec:authorize="hasAnyRole('ADMIN') || hasAuthority('show:profile')"
                    type="submit"><a href="/login">profile</a>
            </button>
            <button class="btn btn-primary" sec:authorize="isAnonymous()" type="submit"><a href="/login">login</a>
            </button>
            <button class="btn btn-danger" sec:authorize="isAuthenticated()" type="submit"><a href="/logout">logout</a>
            </button>
        </div>
    </div>
</nav>

<div sec:authorize="isAuthenticated()">
    <p th:text="${#authentication.name}"></p>
</div>

</body>
</html>
