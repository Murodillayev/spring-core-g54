<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Inventory</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../static/medicine.css">

</head>
<body>
<div th:replace="~{../fragments/navbar :: main-nav('medicine')}" class="navbar-custom"></div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div th:if="${param.error}" class="toast align-items-center text-bg-danger border-0 show" role="alert"
         aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
        <div class="d-flex">
            <div class="toast-body" th:text="${param.error}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>

    <div th:if="${param.success}" class="toast align-items-center text-bg-success border-0 show" role="alert"
         aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
        <div class="d-flex">
            <div class="toast-body" th:text="${param.success}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>
<div class="container mx-auto p-4">
    <div class="search-section">
        <div class="row align-items-center">
            <div class="col-lg-8 col-md-7 mb-3 mb-md-0">
                <form method="GET" action="/medicine" class="row g-2">
                    <div class="col-md-8 col-sm-8">
                        <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-search"></i>
                                </span>
                            <input type="text" class="form-control" name="search"
                                   th:value="${param.search}"
                                   placeholder="dorini ismi boyicha qidirish...">
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-4">
                        <button type="submit" class="btn btn-outline-primary w-100">
                            <i class="fas fa-search me-1"></i>
                            Qidirish
                        </button>
                    </div>
                </form>
            </div>
            <div class="col-lg-4 col-md-5 text-md-end">
                <a type="button" class="btn btn-success w-100 w-md-auto" th:href="@{/medicine/add}">
                    <i class="fas fa-plus me-2"></i>
                    Yaratish
                </a>
            </div>
        </div>
    </div>
</div>
    <br>
    <br>

<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Medicine Inventory</h1>
    <div class="overflow-x-auto ">
        <table class="min-w-full bg-white shadow-md rounded-lg">
            <thead>
            <tr class="bg-blue-600 text-white">
                <th class="py-3 px-4 text-left">#</th>
                <th class="py-3 px-4 text-left">Name</th>
                <th class="py-3 px-4 text-left">Barcode</th>
                <th class="py-3 px-4 text-left">Issue Date</th>
                <th class="py-3 px-4 text-left">Expiry Date</th>
                <th class="py-3 px-4 text-left">Description</th>
                <th class="py-3 px-4 text-left">Category</th>
                <th class="py-3 px-4 text-left">Quantity</th>
                <th class="py-3 px-4 text-left">Price ($)</th>
                <th class="py-3 px-4 text-left">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="medicine, st : ${medicines}" class="border-b hover:bg-gray-100">
                <td class="py-3 px-4" th:text="${st.count}"></td>
                <td class="py-3 px-4" th:text="${medicine.name}"></td>
                <td class="py-3 px-4" th:text="${medicine.barCode}"></td>
                <td class="py-3 px-4" th:text="${medicine.issueDate}"></td>
                <td class="py-3 px-4" th:text="${medicine.expiryDate}"></td>
                <td class="py-3 px-4" th:text="${medicine.description}"></td>
                <td class="py-3 px-4" th:text="${medicine.category.name}"></td>
                <td class="py-3 px-4" th:text="${medicine.quantity}"></td>
                <td class="py-3 px-4" th:text="${#numbers.formatDecimal(medicine.price, 1, 2)}"></td>
                <td class="py-3 px-4">
                    <div class="btn-group btn-group-sm" role="group">
                        <a type="button" class="btn btn-outline-info" th:href="@{medicine/edit/{id}(id=${medicine.id})}">
                            <i class="fas fa-eye"></i>
                            <span class="d-none d-sm-inline ms-1">O'zgartirish</span>
                        </a>

                        <a type="button" class="btn btn-outline-danger" th:href="@{/medicine/delete/{id}(id=${medicine.id})}">
                            <i class="fas fa-trash"></i>
                            <span class="d-none d-sm-inline ms-1">O'chirish</span>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
