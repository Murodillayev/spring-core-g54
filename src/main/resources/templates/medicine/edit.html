<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medicine</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel href="../../static/style.css">
    <link rel="stylesheet" href="../../static/medicineAddEdit.css">
</head>
<body>
<div th:replace="~{../fragments/navbar :: main-nav('medicine')}" class="navbar-custom"></div>

<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">Edit Medicine</h1>

    <div class="form-container">
        <form th:action="@{/medicine/edit}" th:object="${medicine}" method="post">
            <!-- Hidden ID field -->
            <input type="hidden" th:field="*{id}" />

            <!-- Name -->
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" th:field="*{name}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required />
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Barcode -->
            <div class="mb-4">
                <label for="barCode" class="block text-sm font-medium text-gray-700">Barcode</label>
                <input type="text" id="barCode" th:field="*{barCode}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required />
                <span th:if="${#fields.hasErrors('barCode')}" th:errors="*{barCode}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Issue Date -->
            <div class="mb-4">
                <label for="issueDate" class="block text-sm font-medium text-gray-700">Issue Date</label>
                <input type="date" id="issueDate" th:value="*{issueDate}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required />
                <span th:if="${#fields.hasErrors('issueDate')}" th:errors="*{issueDate}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Expiry Date -->
            <div class="mb-4">
                <label for="expiryDate" class="block text-sm font-medium text-gray-700">Expiry Date</label>
                <input type="date" id="expiryDate" th:value="*{expiryDate}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required />
                <span th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Description -->
            <div class="mb-4">
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" th:field="*{description}"
                          class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Category -->
            <div class="mb-4">
                <label for="category" class="block text-sm font-medium text-gray-700">Select Category</label>
                <select id="category" th:field="*{category.id}"
                        class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                        required>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${medCat.name==category.name}"></option>
                </select>
                <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Quantity -->
            <div class="mb-4">
                <label for="quantity" class="block text-sm font-medium text-gray-700">Quantity</label>
                <input type="number" id="quantity" th:field="*{quantity}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required min="0" />
                <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Price -->
            <div class="mb-4">
                <label for="price" class="block text-sm font-medium text-gray-700">Price ($)</label>
                <input type="number" id="price" th:field="*{price}"
                       class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
                       required step="0.01" min="0" />
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-red-500 text-sm"></span>
            </div>

            <!-- Submit and Cancel Buttons -->
            <div class="flex justify-end space-x-4">
                <a th:href="@{/medicine}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Medicine</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
