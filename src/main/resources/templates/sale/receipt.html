<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Receipt Container */
        .receipt-container {
            max-width: 650px;
            width: 100%;
            background: #fff;
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(84, 0, 94, 0.3);
            animation: fadeIn 0.6s ease-in-out;
        }

        /* Header */
        .header {
            text-align: center;
            border-bottom: 4px solid #667eea;
            padding-bottom: 25px;
            margin-bottom: 30px;
        }
        .header h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-size: 2.8em;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1.5px;
            color: white;
        }

        /* Info Sections */
        .info-section {
            margin-bottom: 25px;
            padding: 18px;
            background: linear-gradient(120deg, #f5f7ff, #f8faff);
            border-left: 5px solid #667eea;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .info-section h3 {
            color: #444;
            margin: 0 0 8px 0;
            font-size: 1.25em;
            font-weight: 600;
        }
        .info-section p {
            margin: 4px 0;
            color: #222;
            font-size: 1em;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            font-size: 0.95em;
        }
        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.8px;
        }
        td {
            border-bottom: 1px solid #eee;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #f9faff;
        }

        /* Total Section */
        .total {
            text-align: right;
            font-size: 1.6em;
            font-weight: 700;
            margin: 25px 0;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.5);
        }

        /* Back Button */
        .back-button {
            display: block;
            width: 260px;
            margin: 30px auto 0;
            padding: 14px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.6);
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
<div class="receipt-container">
    <div class="header">
        <h1>Receipt</h1>
    </div>
    <div class="info-section">
        <h3>Cashier</h3>
        <p><strong>Name:</strong> <span th:text="${sale.cashier.name}"></span></p>
    </div>

    <div class="info-section">
        <h3>Purchase Time</h3>
        <p><strong>Time:</strong> <span th:text="${#temporals.format(sale.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    </div>

    <table>
        <thead>
        <tr>
            <th>Medicine Name</th>
            <th>Unit Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${sale.items}">
            <td th:text="${item.medicine.name}"></td>
            <td th:text="${item.unitPrice}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.unitPrice * item.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        Total Price: $<span th:text="${sale.totalPrice}"></span>
    </div>

    <a th:href="@{/sale}" class="back-button">Back to Purchases</a>
</div>
</body>
</html>
